<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schafkopf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1c15">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>Schafkopf</title>
<style>
:root{--bg:#0f1c15;--card:#18291f;--line:#274034;--tx:#eef3ee;--mu:#93a99a;--ac:#2f7d52;--win:#4fcf82;--loss:#ff6b66;--r:14px;--pd:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}body{font:1rem/1.4 -apple-system,system-ui,sans-serif}
#app{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(90px + env(safe-area-inset-bottom))}
.band{height:12px;margin:-14px -14px 12px;background:linear-gradient(45deg,#5aa0d8 25%,transparent 25%,transparent 75%,#5aa0d8 75%),linear-gradient(45deg,#5aa0d8 25%,#fff 25%,#fff 75%,#5aa0d8 75%);background-size:12px 12px;background-position:0 0,6px 6px}
.noband .band{display:none}
h2{font-size:24px;margin:.2em 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pd);margin:0 0 10px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);min-height:48px;padding:0 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.d{background:#6b2727;border-color:#6b2727;color:#fff;width:100%;margin-top:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.seg button{flex:1;min-width:70px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);min-height:48px;padding:0 12px;width:100%}
label{display:block;color:var(--mu);font-size:.85rem;margin-top:8px}
.w{color:var(--win)}.l{color:var(--loss)}.mu{color:var(--mu);font-size:.85rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}.k b{font-size:1.2rem;display:block}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 3px;text-align:right}td:first-child,th:first-child{text-align:left}
.warn{background:#4a2a14;color:#ffd2a8;padding:10px;border-radius:12px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:11px;min-height:56px;padding:0 2px;color:var(--mu)}
nav button.on{color:var(--win)}nav i{font-style:normal;font-size:20px;display:block}
</style></head><body>
<div id="app"></div>
<nav>
<button data-t=list onclick="go('list')"><i>🃏</i>Abende</button>
<button data-t=new onclick="go('new')"><i>➕</i>Neuer Abend</button>
<button data-t=stat onclick="go('stat')"><i>📊</i>Statistik</button>
<button data-t=set onclick="go('set')"><i>⚙️</i>Einstellungen</button>
</nav>
<script>
const defTh={bg:'dark',ac:'green',wl:'gr',rad:14,fs:17,dens:12,smooth:1,fill:1,grid:1,band:1};
let DB={me:'',evenings:[],settings:{tarif:{sau:.1,solo:.2,ramsch:.1},th:{...defTh}}},tab='list',evId=null,nf=null,gf=null,post=[],sf={from:'',to:'',place:''};
const SPIELE=['Sauspiel','Wenz','Solo','Geier','Ramsch'],SOLO=['Wenz','Solo','Geier'],DAYS=['So','Mo','Di','Mi','Do','Fr','Sa'];
const BG={dark:['Dunkelgrün',['#0f1c15','#18291f','#274034','#eef3ee','#93a99a']],black:['Schwarz',['#000000','#111613','#26302a','#f2f2f2','#98a39b']],slate:['Schiefer',['#0f1722','#192434','#2a3a50','#eaf0f7','#93a3b8']],light:['Hell',['#eef3ec','#ffffff','#d3ddd0','#14221a','#5d6f63']]};
const ACC={green:['Grün','#2f7d52'],blue:['Bayernblau','#2d6fb7'],gold:['Gold','#b8862b'],wine:['Bordeaux','#a23a4b'],violet:['Violett','#7a5bc4']};
const WL={gr:['Grün / Rot','#4fcf82','#ff6b66','#1b9a52','#d23b36'],bo:['Blau / Orange','#4aa3ff','#ff9a3d','#1f6fd1','#d9730d']};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),sum=a=>a.reduce((x,y)=>x+y,0);
const r2=n=>Math.round(n*100)/100,fm=n=>n.toFixed(2).replace('.',',')+' €',eur=n=>(n>.004?'+':'')+fm(Math.abs(n)<.005?0:n);
const cls=n=>n>.004?'w':n<-.004?'l':'',esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),pc=(a,b)=>b?Math.round(a/b*100)+' %':'–';
const fd=d=>new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}),sd=d=>d.slice(8)+'.'+d.slice(5,7)+'.';
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const ce=()=>DB.evenings.find(e=>e.id==evId),places=()=>[...new Set(DB.evenings.map(e=>e.place).filter(Boolean))],$=s=>document.querySelector(s);
// ---------- Speicher ----------
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('schafkopf2',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const d=await idb();await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>{if(q.result)DB=q.result;r()};q.onerror=()=>r()})}catch(e){}DB.settings.th={...defTh,...DB.settings.th}}
async function save(){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(DB)),'db')}catch(e){alert('Speichern fehlgeschlagen')}}
// ---------- Thema ----------
function applyTheme(){const t=DB.settings.th,s=document.documentElement.style,b=BG[t.bg][1],lt=t.bg=='light',w=WL[t.wl];
 ['bg','card','line','tx','mu'].forEach((k,i)=>s.setProperty('--'+k,b[i]));s.setProperty('--ac',ACC[t.ac][1]);s.setProperty('--win',lt?w[3]:w[1]);s.setProperty('--loss',lt?w[4]:w[2]);
 s.setProperty('--r',t.rad+'px');s.setProperty('--pd',t.dens+'px');s.fontSize=t.fs+'px';s.colorScheme=lt?'light':'dark';document.body.classList.toggle('noband',!t.band);$('meta[name=theme-color]').content=b[0]}
const thset=(k,v)=>{DB.settings.th[k]=v;applyTheme();save();render()};
// ---------- Berechnung (nur mein Ergebnis) ----------
function gval(g,t){const b=g.art=='Sauspiel'?t.sau:g.art=='Ramsch'?t.ramsch:t.solo;let v=g.art=='Ramsch'?b:b*(1+(g.sn||0)+(+g.lauf||0));if(g.art!='Ramsch'){if(g.kontra)v*=2;if(g.re)v*=2}return v}
function amt(g,t){if(g.role=='aus')return 0;const v=gval(g,t);if(g.art=='Ramsch')return r2(g.role=='sp'?-3*v:v);return r2((g.win?1:-1)*v*(g.role=='sp'&&g.art!='Sauspiel'?3:1))}
const resEv=e=>e.mode=='simple'?+e.result||0:r2(sum(e.games.map(g=>amt(g,e.tarif))));
const roles=a=>a=='Sauspiel'?[['sp','Ich spiele'],['mit','Mitspieler'],['geg','Gegner'],['aus','Ausgesetzt']]:a=='Ramsch'?[['sp','Ich verloren'],['geg','Anderer verloren'],['aus','Ausgesetzt']]:[['sp','Ich spiele'],['geg','Gegner'],['aus','Ausgesetzt']];
const rname=(a,r)=>(roles(a).find(x=>x[0]==r)||[0,'?'])[1];
// ---------- Diagramme (Canvas, offline) ----------
const V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function cv(w,h){const c=document.createElement('canvas'),d=devicePixelRatio||1;c.width=w*d;c.height=h*d;c.style.cssText='width:100%;height:auto;aspect-ratio:'+w+'/'+h;const x=c.getContext('2d');x.scale(d,d);return[c,x]}
function frame(W,H,all,B,pct){const[c,x]=cv(W,H);let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx==mn)mx=mn+1;const L=42,R=8,T=10,Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);x.font='10px sans-serif';x.lineWidth=1;
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);if(DB.settings.th.grid){x.strokeStyle=V('--line');x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke()}x.fillStyle=V('--mu');x.fillText(pct?Math.round(v)+'%':v.toFixed(1),2,y+3)}
 x.strokeStyle=V('--mu');x.beginPath();x.moveTo(L,Y(0));x.lineTo(W-R,Y(0));x.stroke();return{c,x,Y,L,R,W}}
function line(d){const t=DB.settings.th,f=frame(340,220,d,10),{x,Y,L,R,W}=f,n=d.length,X=i=>L+i*(W-L-R)/Math.max(1,n-1);
 const P=()=>{x.beginPath();d.forEach((v,i)=>{if(!i)x.moveTo(X(i),Y(v));else if(t.smooth){const q=(X(i-1)+X(i))/2;x.bezierCurveTo(q,Y(d[i-1]),q,Y(v),X(i),Y(v))}else x.lineTo(X(i),Y(v))})};
 if(t.fill){P();x.lineTo(X(n-1),Y(0));x.lineTo(X(0),Y(0));x.closePath();x.globalAlpha=.18;x.fillStyle=V('--ac');x.fill();x.globalAlpha=1}
 P();x.strokeStyle=V('--ac');x.lineWidth=2.5;x.stroke();if(n<40){x.fillStyle=V('--ac');d.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v),3,0,7);x.fill()})}return f.c}
function bars(I,pct){const n=I.length,lab=n<=12,f=frame(340,210,pct?[0,100]:I.map(i=>i[1]),lab?26:10,pct),{x,Y,L,R,W}=f,gw=(W-L-R)/n,bw=Math.max(2,Math.min(26,gw*.7));
 I.forEach(([l,v],i)=>{x.fillStyle=pct?V('--ac'):v>=0?V('--win'):V('--loss');const cx=L+gw*i+(gw-bw)/2;x.fillRect(cx,Math.min(Y(v),Y(0)),bw,Math.max(1,Math.abs(Y(v)-Y(0))));if(lab){x.fillStyle=V('--mu');x.textAlign='center';x.fillText(String(l).slice(0,8),cx+bw/2,202)}});x.textAlign='left';return f.c}
function pie(I){const[c,x]=cv(340,Math.max(170,I.length*24+30)),t=sum(I.map(i=>i[1])),C=[V('--ac'),'#5aa0d8','#f2b84b','#e57ab0','#a98bf0','#ff8a5b'];let a=-Math.PI/2;
 I.forEach(([n,v],i)=>{const e=a+v/t*2*Math.PI;x.fillStyle=C[i%6];x.beginPath();x.moveTo(85,85);x.arc(85,85,78,a,e);x.fill();a=e;x.fillRect(180,18+i*24,12,12);x.fillStyle=V('--tx');x.font='13px sans-serif';x.fillText(n+' '+v+' ('+Math.round(v/t*100)+'%)',198,29+i*24)});return c}
// ---------- UI-Helfer ----------
const seg=(fn,key,o,c)=>`<div class=seg>${o.map(([v,t,k])=>`<button class="${v===c?'on':''}" style="${k?'border-bottom:4px solid '+k:''}" onclick='${fn}(${JSON.stringify(key)},${JSON.stringify(v)})'>${esc(t)}</button>`).join('')}</div>`;
const tin=(t,fn)=>[['sau','Sauspiel (€)'],['solo','Solo / Wenz / Geier (€)'],['ramsch','Ramsch (€)']].map(([k,l])=>`<label>${l}</label><input type=number step=.01 value="${t[k]}" onchange="${fn}('${k}',this.value)">`).join('');
const go=t=>{tab=t;evId=null;render();scrollTo(0,0)},nset=(k,v)=>{nf[k]=v;render()},sset=(k,v)=>{sf[k]=v;render()};
const gset=(k,v)=>{gf[k]=v;if(k=='art'&&!roles(v).some(r=>r[0]==gf.role))gf.role='sp';render()};
const nT=(k,v)=>nf.tarif[k]=+v,sT=(k,v)=>{DB.settings.tarif[k]=+v;save()},edT=(k,v)=>{ce().tarif[k]=+v;save();render()};
const edEv=(k,v)=>{ce()[k]=v;save();render()},openEv=id=>{evId=id;gf=null;tab='list';render();scrollTo(0,0)};
const kp=(l,v,c='')=>`<div class=k><span class=mu>${l}</span><b class="${c}">${v}</b></div>`;
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#app').innerHTML='<div class=band></div>'+(tab=='list'&&evId?vEv():{list:vList,new:vNew,stat:vStat,set:vSet}[tab]());post.forEach(f=>f());post=[]}
const mount=(id,c)=>{const d=document.getElementById(id);if(d)d.appendChild(c)};
// ---------- Abende ----------
function vList(){const E=DB.evenings.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0),t=r2(sum(E.map(resEv)));
 return '<h2>Meine Abende</h2>'+(E.length?`<div class="card row"><span class=mu>Gesamtbilanz aus ${E.length} Abenden</span><b class="${cls(t)}">${eur(t)}</b></div>`+E.map(e=>{const r=resEv(e);return `<div class="card row" onclick="openEv('${e.id}')"><div><b>${fd(e.date)}</b><div class=mu>${e.place?esc(e.place)+', ':''}${e.mode=='simple'?'Endstand':e.games.length+' Spiele'}</div></div><b class="${cls(r)}" style="font-size:1.2rem">${eur(r)}</b></div>`}).join(''):'<div class=card>Noch keine Abende. Starte unter „Neuer Abend“.</div>')}
function vEv(){const e=ce();if(!e){evId=null;return vList()}
 const r=resEv(e),det=e.mode=='detailed';if(!gf)gf={art:'Sauspiel',role:'sp',win:1,sn:0,lauf:0,kontra:0,re:0};
 let h=`<button onclick="evId=null;render()">‹ Zurück</button><h2>${fd(e.date)}</h2><div class=card><label>Datum</label><input type=date value="${e.date}" onchange="edEv('date',this.value)"><label>Ort</label><input value="${esc(e.place||'')}" onchange="edEv('place',this.value)">${det?`<details><summary class=mu style="margin-top:12px">Tarif ändern</summary>${tin(e.tarif,'edT')}</details>`:''}</div>`;
 h+=det?`<div class="card row"><b>Mein Ergebnis</b><b class="${cls(r)}" style="font-size:1.4rem">${eur(r)}</b></div>`:`<div class=card><label>Mein Gewinn / Verlust in € (Verlust mit Minus)</label><input type=number step=.01 placeholder="± €" value="${e.result??''}" onchange="edEv('result',+this.value)"><div class="${cls(r)}" style="font-size:1.4rem;margin-top:8px">${eur(r)}</div></div>`;
 if(det){const R=gf.art=='Ramsch'||gf.role=='aus';
  h+=`<div class=card><b>Neues Spiel</b><label>Spielart</label>${seg('gset','art',SPIELE.map(a=>[a,a]),gf.art)}<label>Meine Rolle</label>${seg('gset','role',roles(gf.art),gf.role)}${R?'':`<label>Ich habe</label>${seg('gset','win',[[1,'Gewonnen'],[0,'Verloren']],gf.win)}<label>Schneider / Schwarz</label>${seg('gset','sn',[[0,'Normal'],[1,'Schneider'],[2,'Schwarz']],gf.sn)}<label>Laufende</label><div class=row style="flex-wrap:nowrap"><button onclick="gset('lauf',Math.max(0,gf.lauf-1))">−</button><b style="font-size:1.5rem">${gf.lauf}</b><button onclick="gset('lauf',gf.lauf+1)">+</button></div><label>Verdoppeln</label>${seg('gset','kontra',[[0,'Kein Kontra'],[1,'Kontra']],gf.kontra)}${seg('gset','re',[[0,'Kein Re'],[1,'Re']],gf.re)}`}<div class=mu>Mein Ergebnis in diesem Spiel: <b class="${cls(amt(gf,e.tarif))}">${eur(amt(gf,e.tarif))}</b></div><button class=p onclick="addG()">Spiel speichern</button></div>`;
  if(e.games.length){h+=`<div class=card><b>Verlauf</b><div id=c1></div></div><div class=card><b>Spiele (${e.games.length})</b>${e.games.map((g,i)=>{const a=amt(g,e.tarif);return `<div class=row style="border-top:1px solid var(--line);padding:8px 0;flex-wrap:nowrap"><span>${i+1}. ${g.art}, ${rname(g.art,g.role)}<br><span class=mu>${g.art=='Ramsch'||g.role=='aus'?'':(g.win?'gewonnen':'verloren')+(['',', Schneider',', Schwarz'][g.sn]||'')+(g.lauf?', '+g.lauf+' Laufende':'')+(g.kontra?', Kontra':'')+(g.re?', Re':'')}</span></span><b class="${cls(a)}">${eur(a)}</b><button onclick="delG(${i})">✕</button></div>`}).reverse().join('')}</div>`;
   post.push(()=>{let c=0;mount('c1',line([0,...e.games.map(g=>c=r2(c+amt(g,e.tarif)))]))})}}
 return h+`<button class=d onclick="delEv()">Abend löschen</button>`}
function addG(){const e=ce();e.games.push({...gf,id:uid()});gf={...gf,win:1,sn:0,lauf:0,kontra:0,re:0};save();render()}
function delG(i){if(confirm('Spiel löschen?')){ce().games.splice(i,1);save();render()}}
function delEv(){if(confirm('Diesen Abend endgültig löschen?')){DB.evenings=DB.evenings.filter(e=>e.id!=evId);evId=null;save();render()}}
// ---------- Neuer Abend ----------
function vNew(){nf=nf||{date:today(),place:'',mode:'simple',tarif:{...DB.settings.tarif}};
 return `<h2>Neuer Abend</h2><label>Datum</label><input type=date value="${nf.date}" onchange="nf.date=this.value"><label>Ort (optional)</label><input value="${esc(nf.place)}" list=orte onchange="nf.place=this.value"><datalist id=orte>${places().map(o=>`<option>${esc(o)}</option>`).join('')}</datalist>
 <label>Erfassung</label>${seg('nset','mode',[['simple','Einfach: Endstand'],['detailed','Detailliert: Spiele']],nf.mode)}<b>Tarif</b>${tin(nf.tarif,'nT')}<button class=p onclick="startEv()">Abend starten</button>`}
function startEv(){const e={id:uid(),date:nf.date,place:nf.place.trim(),mode:nf.mode,tarif:{...nf.tarif},result:0,games:[]};DB.evenings.push(e);save();nf=null;openEv(e.id)}
// ---------- Statistik ----------
function vStat(){const evs=DB.evenings.filter(e=>(!sf.from||e.date>=sf.from)&&(!sf.to||e.date<=sf.to)&&(!sf.place||e.place==sf.place)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id<b.id?-1:1);
 let h=`<h2>Statistik${DB.me?' – '+esc(DB.me):''}</h2><div class=card><div class=row style="flex-wrap:nowrap;gap:8px"><div><label>Von</label><input type=date value="${sf.from}" onchange="sset('from',this.value)"></div><div><label>Bis</label><input type=date value="${sf.to}" onchange="sset('to',this.value)"></div></div><label>Ort</label><select onchange="sset('place',this.value)"><option value="">Alle Orte</option>${places().map(o=>`<option ${o==sf.place?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;
 if(!evs.length)return h+'<div class=card>Keine Abende im gewählten Filter.</div>';
 const v=evs.map(resEv),n=v.length,tot=r2(sum(v)),avg=tot/n,mx=Math.max(...v),mn=Math.min(...v),sdv=Math.sqrt(sum(v.map(x=>(x-avg)**2))/n);
 let cw=0,cl=0,mw=0,ml=0;v.forEach(x=>{if(x>0){cw++;cl=0}else if(x<0){cl++;cw=0}else cw=cl=0;mw=Math.max(mw,cw);ml=Math.max(ml,cl)});
 const G=[];evs.filter(e=>e.mode=='detailed').forEach(e=>e.games.forEach(g=>{if(g.role!='aus')G.push({g,a:amt(g,e.tarif)})}));
 const A={},RL={};G.forEach(({g,a})=>{const o=A[g.art]=A[g.art]||{n:0,w:0,s:0};o.n++;o.w+=a>0?1:0;o.s=r2(o.s+a);const k=g.art=='Ramsch'?'Ramsch':rname('Solo',g.role).replace('Ich spiele','Spieler').replace('Gegner','Gegner');RL[g.role=='mit'?'Mitspieler':g.art=='Ramsch'?'Ramsch':g.role=='sp'?'Spieler':'Gegner']=(RL[g.role=='mit'?'Mitspieler':g.art=='Ramsch'?'Ramsch':g.role=='sp'?'Spieler':'Gegner']||0)+1});
 const so=G.filter(x=>x.g.role=='sp'&&SOLO.includes(x.g.art)),sp=G.filter(x=>x.g.role=='sp'&&x.g.art!='Ramsch').length;
